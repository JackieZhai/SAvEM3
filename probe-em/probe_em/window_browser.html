<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Probe-EM test windows</title>
<style>
  :root { color-scheme:dark; font:14px system-ui,sans-serif; background:#11151a; color:#edf2f7; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; flex-wrap:wrap; gap:10px; padding:10px 14px; border-bottom:1px solid #414b57; }
  strong { margin-right:6px; white-space:nowrap; }
  button,select,a { font:inherit; color:inherit; border:1px solid #556474; border-radius:5px; padding:7px 10px; background:#202b35; }
  button { cursor:pointer; } button:hover,a:hover { background:#324552; }
  button:focus-visible,select:focus-visible,a:focus-visible { outline:2px solid #7ad6cd; outline-offset:2px; }
  select { min-width:170px; } a { text-decoration:none; }
  .hint { color:#b9c5d1; margin-left:auto; font-size:12px; }
  main { flex:1; position:relative; min-height:0; }
  iframe { border:0; height:100%; width:100%; visibility:hidden; background:#111; }
  #notice { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px; padding:24px; text-align:center; }
  #notice[hidden], [hidden] { display:none !important; }
  #message { max-width:680px; white-space:pre-wrap; overflow-wrap:anywhere; color:#d8e1eb; }
</style>
<header>
  <strong>Probe-EM</strong>
  <button id="previous" type="button" aria-label="Previous test window">Previous window</button>
  <select id="window" aria-label="Test window"></select>
  <button id="next" type="button" aria-label="Next test window">Next window</button>
  <a id="standalone" target="_blank" rel="noopener" hidden>Open in tab</a>
  <span class="hint">Click the image · D/F: slices · P/N: points · I: predict · V: propagate</span>
</header>
<main>
  <iframe id="viewer" title="Neuroglancer test window" allow="fullscreen"></iframe>
  <div id="notice"><span id="message" role="status" aria-live="polite">Loading window list…</span><button id="retry" type="button" hidden>Retry loading</button></div>
</main>
<script>
  const base=location.pathname.replace(/\/$/,''), select=document.querySelector('#window'), frame=document.querySelector('#viewer');
  const message=document.querySelector('#message'), notice=document.querySelector('#notice'), retry=document.querySelector('#retry'), standalone=document.querySelector('#standalone');
  let windows=[], current=0, generation=0;
  const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  async function api(path,method='GET') {
    const response=await fetch(base+'/api/'+path,{method,cache:'no-store'});
    const data=await response.json();
    if(!response.ok) throw new Error(data.error||'Request failed');
    return data;
  }
  async function choose(index,repeat=false) {
    const version=++generation;
    current=(index+windows.length)%windows.length;
    select.value=String(current);
    history.replaceState(null,'','#window='+current);
    frame.style.visibility='hidden'; notice.hidden=false; retry.hidden=true; standalone.hidden=true;
    message.textContent='Loading '+windows[current].name+'… Points and results in other windows are retained.';
    try {
      let data=await api('windows/'+current+(repeat?'/retry':''),repeat?'POST':'GET');
      while(data.state==='loading') {
        await delay(750);
        if(version!==generation) return;
        data=await api('windows/'+current);
      }
      if(version!==generation) return;
      if(data.state!=='ready') throw new Error(data.error||'Window is unavailable');
      frame.onload=()=>{if(version===generation){notice.hidden=true;frame.style.visibility='visible';frame.contentWindow.focus();}};
      standalone.href=data.url; standalone.hidden=false;
      frame.src=data.url;
    } catch(error) {
      if(version===generation){message.textContent=error.message;retry.hidden=false;}
    }
  }
  document.querySelector('#previous').onclick=()=>choose(current-1);
  document.querySelector('#next').onclick=()=>choose(current+1);
  select.onchange=()=>choose(Number(select.value));
  retry.onclick=()=>choose(current,true);
  (async()=>{
    try {
      const data=await api('windows'); windows=data.windows;
      for(const item of windows){const option=document.createElement('option');option.value=item.index;option.textContent=item.name;select.append(option);}
      const match=location.hash.match(/^#window=(\d+)$/), index=match?Number(match[1]):data.initial_index;
      await choose(index>=0&&index<windows.length?index:data.initial_index);
    } catch(error){message.textContent=error.message;}
  })();
</script>
</html>
